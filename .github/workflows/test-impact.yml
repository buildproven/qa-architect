# Generated by QA Architect. Preserve existing workflows during canary use.
name: Test impact

on:
  pull_request_target:
  schedule:
    - cron: '23 7 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-impact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Create trusted test plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Check out protected policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: protected
          persist-credentials: false
      - name: Check out the pinned planner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: buildproven/claude-kit
          ref: f17dcc49adaf335c7e3168d15d4ed2ada1d818d8
          path: runtime
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Verify protected package scripts
        if: github.event_name == 'pull_request_target'
        env:
          CANDIDATE_PACKAGE: candidate/package.json
          PROTECTED_PACKAGE: protected/package.json
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const readScripts = file => fs.existsSync(file)
            ? JSON.parse(fs.readFileSync(file, 'utf8')).scripts || {}
            : {}
          const candidate = readScripts(process.env.CANDIDATE_PACKAGE)
          const protectedScripts = readScripts(process.env.PROTECTED_PACKAGE)
          if (JSON.stringify(candidate) !== JSON.stringify(protectedScripts)) {
            throw new Error('Package scripts changed. Merge a reviewed policy update before this change.')
          }
          NODE
      - name: Create affected-test plan
        id: plan
        if: github.event_name == 'pull_request_target'
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "$BASE_SHA"
          fi
          mapfile -d '' changed < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          plan=$(node ../runtime/scripts/test-impact.js --policy-root ../protected -- "${changed[@]}" | jq -c .)
          if [ "$(jq -r .mode <<<"$plan")" = unmapped ]; then
            jq -r .remediation <<<"$plan" >&2
            exit 2
          fi
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

  run-selected:
    name: Run selected tests
    if: github.event_name == 'pull_request_target' && needs.plan.result == 'success'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Set up the declared package manager
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          true
      - name: Install declared dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
      - name: Run immutable selected commands
        env:
          TRUSTED_PLAN: ${{ needs.plan.outputs.plan }}
        run: |
          node - <<'NODE'
          const { spawnSync } = require('node:child_process')
          const plan = JSON.parse(process.env.TRUSTED_PLAN)
          for (const command of plan.commands || []) {
            const result = spawnSync(command.executable, command.args, {
              env: process.env,
              stdio: 'inherit',
            })
            if (result.error) throw result.error
            if (result.status !== 0) process.exit(result.status || 1)
          }
          NODE

  audit:
    name: Run complete selector audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out protected branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Set up the declared package manager
        if: ${{ hashFiles('package.json') != '' }}
        run: |
          true
      - name: Install declared dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts
      - name: Run complete commands from protected policy
        env:
          TRUSTED_COMMANDS_BASE64: 'W3siZXhlY3V0YWJsZSI6Im5wbSIsImFyZ3MiOlsicnVuIiwidGVzdCJdfV0='
        run: |
          node - <<'NODE'
          const { spawnSync } = require('node:child_process')
          const commands = JSON.parse(Buffer.from(
            process.env.TRUSTED_COMMANDS_BASE64,
            'base64'
          ).toString('utf8'))
          for (const command of commands) {
            const result = spawnSync(command.executable, command.args, {
              env: process.env,
              stdio: 'inherit',
            })
            if (result.error) throw result.error
            if (result.status !== 0) process.exit(result.status || 1)
          }
          NODE

  quality-required:
    name: quality / required
    if: always()
    needs: [plan, run-selected, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable test job
        run: |
          event='${{ github.event_name }}'
          plan='${{ needs.plan.result }}'
          selected='${{ needs.run-selected.result }}'
          audit='${{ needs.audit.result }}'
          if [ "$event" = pull_request_target ]; then
            [ "$plan" = success ] && [ "$selected" = success ]
          else
            [ "$audit" = success ]
          fi
