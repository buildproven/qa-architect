name: Release

on:
  push:
    tags: ['v*']

permissions:
  id-token: write # Required for OIDC trusted publishing to npm
  contents: write # Required for creating GitHub releases

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEMGREP_VERSION: '1.172.0'
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Python for pinned Semgrep
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # OIDC trusted publishing requires npm >= 11.5. We pin to 11.5.2 (the
      # first OIDC-stable release) instead of `npm@latest` to avoid the
      # MODULE_NOT_FOUND (promise-retry) regression hit when self-upgrading
      # over the setup-node-provided npm on top of the newest 11.x.
      - name: Pin npm for OIDC trusted publishing
        run: npm install -g npm@11.5.2

      - name: Install dependencies
        run: npm ci --no-audit
        env:
          CI: 'true'

      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          test "$TAG_NAME" = "$expected" || {
            echo "Tag $TAG_NAME does not match package version $expected"
            exit 1
          }

      # The prerelease suite includes the assurance-pack precision benchmark,
      # which intentionally fails closed when its semgrep engine is absent.
      # Keep the release gate equivalent to the CI gate instead of silently
      # publishing a package whose static assurance benchmark did not run.
      - name: Install Semgrep CLI for prerelease checks
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          # Install only the explicitly hash-locked packages. The lock overrides
          # Semgrep's vulnerable MCP pin with the compatible upstream fix floor.
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet --no-deps --require-hashes \
            --only-binary=:all: \
            --requirement .github/semgrep-release-requirements.txt
          test "$("$RUNNER_TEMP/semgrep-venv/bin/semgrep" --version)" = "$SEMGREP_VERSION"
          echo "$RUNNER_TEMP/semgrep-venv/bin" >> "$GITHUB_PATH"

      - name: Run pre-release checks
        run: |
          set -euo pipefail
          test "$(command -v semgrep)" = "$RUNNER_TEMP/semgrep-venv/bin/semgrep"
          test "$(semgrep --version)" = "$SEMGREP_VERSION"
          npm run prerelease
        env:
          CI: 'true'

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes in ${{ github.ref_name }}

            See [CHANGELOG.md](CHANGELOG.md) for detailed changes.

            ## Installation
            ```bash
            npx create-qa-architect@latest
            ```

            ## Update existing projects
            ```bash
            npx create-qa-architect@latest --update
            ```
          draft: false
          prerelease: false
